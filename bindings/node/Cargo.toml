[package]
name = "mimae-node"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Node.js binding for the Mimae coordination layer (napi-rs, JSON-string surface)"

[lib]
crate-type = ["cdylib"]

[dependencies]
mimae-core = { path = "../.." }
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
