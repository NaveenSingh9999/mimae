[package]
name = "mimae-core"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Typed, versioned event vocabulary and core entities for the Mimae coordination layer"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[workspace]
members = [".", "bindings/node"]
